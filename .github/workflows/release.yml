name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Tags can race when batched; one release run at a time is plenty.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to publish a GitHub Release
      id-token: write   # required for keyless cosign signing via GitHub Actions OIDC
    steps:
      - uses: actions/checkout@v6
        with:
          # GoReleaser's changelog needs the full history to diff back
          # to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Cosign on PATH so the .goreleaser.yaml `signs` block can run
      # `cosign sign-blob` over each archive. Sigstore's keyless flow
      # picks up the OIDC token from `id-token: write` above.
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-release-smoke:
    name: Post-release smoke (published asset)
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The point of this job is that it runs the artifact operators will
      # actually download — not a binary this workflow built. A release
      # that publishes fine and then fails at its first real use is a
      # broken release, and nothing before this step would have said so.
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*linux_amd64.tar.gz' --dir /tmp/rel
          tar xzf /tmp/rel/*linux_amd64.tar.gz -C /tmp/rel bough
          chmod +x /tmp/rel/bough

      - name: Entry-point smoke against the released binary
        env:
          BOUGH_EXPECT_VERSION: ${{ github.ref_name }}
        run: ./scripts/entrypoint-smoke.sh /tmp/rel/bough
